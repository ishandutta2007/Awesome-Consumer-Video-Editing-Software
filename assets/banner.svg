<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360" fill="none">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d17" />
      <stop offset="50%" stop-color="#12182c" />
      <stop offset="100%" stop-color="#07090e" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.08)" />
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0.02)" />
    </linearGradient>

    <!-- Glowing Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="35" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      .title-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 800;
        font-size: 42px;
        fill: #ffffff;
      }
      .subtitle-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 500;
        font-size: 19px;
        fill: #94a3b8;
      }
      .pill-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 600;
        font-size: 13px;
        fill: #e2e8f0;
      }
      
      /* Subtle ambient animations that stay behind texts */
      @keyframes floatOrb1 {
        0%, 100% { transform: translate(0px, 0px) scale(1); }
        50% { transform: translate(40px, -25px) scale(1.1); }
      }
      @keyframes floatOrb2 {
        0%, 100% { transform: translate(0px, 0px) scale(1); }
        50% { transform: translate(-35px, 30px) scale(1.15); }
      }
      @keyframes playheadScan {
        0% { transform: translateX(0px); opacity: 0.2; }
        20% { opacity: 0.9; }
        80% { opacity: 0.9; }
        100% { transform: translateX(540px); opacity: 0.2; }
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.4; }
        50% { opacity: 0.75; }
      }
      
      .orb-1 { animation: floatOrb1 9s ease-in-out infinite; transform-origin: center; }
      .orb-2 { animation: floatOrb2 11s ease-in-out infinite; transform-origin: center; }
      .playhead { animation: playheadScan 5s ease-in-out infinite; }
      .grid-pulse { animation: pulseGlow 4s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Deep Slate Canvas Background -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGradient)" stroke="#1e293b" stroke-width="1.5" />

  <!-- Animated Glowing Ambience / Orbs (Deep in background) -->
  <g class="grid-pulse">
    <!-- Grid Pattern -->
    <path d="M 0,60 L 1200,60 M 0,120 L 1200,120 M 0,180 L 1200,180 M 0,240 L 1200,240 M 0,300 L 1200,300" stroke="rgba(255,255,255,0.025)" stroke-width="1" />
    <path d="M 150,0 L 150,360 M 300,0 L 300,360 M 450,0 L 450,360 M 600,0 L 600,360 M 750,0 L 750,360 M 900,0 L 900,360 M 1050,0 L 1050,360" stroke="rgba(255,255,255,0.025)" stroke-width="1" />
  </g>

  <g class="orb-1" filter="url(#glow)">
    <circle cx="180" cy="110" r="110" fill="#6366f1" opacity="0.32" />
  </g>
  <g class="orb-2" filter="url(#glow)">
    <circle cx="1020" cy="220" r="130" fill="#ec4899" opacity="0.25" />
    <circle cx="780" cy="90" r="90" fill="#06b6d4" opacity="0.2" />
  </g>

  <!-- Dynamic Timeline / Filmstrip Graphic at the Bottom Right -->
  <g transform="translate(620, 215)">
    <!-- Track Backdrop -->
    <rect x="0" y="0" width="540" height="72" rx="10" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.1)" stroke-width="1" />
    
    <!-- Timeline Tracks -->
    <!-- Video Track 1 -->
    <rect x="15" y="10" width="130" height="22" rx="4" fill="#6366f1" opacity="0.75" />
    <text x="25" y="25" fill="#ffffff" font-size="10" font-family="sans-serif" font-weight="bold">🎬 A-ROLL.mp4</text>
    
    <rect x="155" y="10" width="180" height="22" rx="4" fill="#a855f7" opacity="0.75" />
    <text x="165" y="25" fill="#ffffff" font-size="10" font-family="sans-serif" font-weight="bold">✨ B-ROLL_4K.mov</text>

    <rect x="345" y="10" width="140" height="22" rx="4" fill="#ec4899" opacity="0.75" />
    <text x="355" y="25" fill="#ffffff" font-size="10" font-family="sans-serif" font-weight="bold">🎞️ OUTRO.webm</text>

    <!-- Audio Track 2 -->
    <rect x="15" y="38" width="260" height="22" rx="4" fill="#06b6d4" opacity="0.6" />
    <text x="25" y="53" fill="#ffffff" font-size="10" font-family="sans-serif" font-weight="bold">🎵 Soundtrack.flac</text>

    <rect x="285" y="38" width="200" height="22" rx="4" fill="#10b981" opacity="0.6" />
    <text x="295" y="53" fill="#ffffff" font-size="10" font-family="sans-serif" font-weight="bold">🎙️ Voiceover_HQ.wav</text>

    <!-- Animated Playhead Scanning -->
    <g class="playhead">
      <line x1="0" y1="0" x2="0" y2="72" stroke="#ef4444" stroke-width="2" />
      <polygon points="-5,0 5,0 0,8" fill="#ef4444" />
    </g>
  </g>

  <!-- Content Foreground (Clean, perfectly readable, unoccluded) -->
  <g transform="translate(60, 50)">
    <!-- Category Badge -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="195" height="28" rx="14" fill="rgba(99, 102, 241, 0.2)" stroke="#6366f1" stroke-width="1" />
      <circle cx="14" cy="14" r="4" fill="#22c55e" />
      <text x="26" y="18" fill="#c7d2fe" font-size="12" font-family="sans-serif" font-weight="700" letter-spacing="1">CURATED ECOSYSTEM</text>
    </g>

    <!-- Main Title with Gradient Fill -->
    <text x="0" y="78" class="title-text">
      Awesome Consumer Video Editing
    </text>

    <!-- Subtitle -->
    <text x="0" y="116" class="subtitle-text">
      Top SaaS platforms, self-hosted NLEs &amp; watermark-free open-source software
    </text>

    <!-- Feature Pills in Foreground -->
    <g transform="translate(0, 145)">
      <!-- Pill 1: Open-Source -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="135" height="34" rx="17" fill="rgba(255, 255, 255, 0.06)" stroke="rgba(255,255,255,0.12)" stroke-width="1" />
        <text x="18" y="22" class="pill-text">🚀 Open Source</text>
      </g>
      
      <!-- Pill 2: Watermark-Free -->
      <g transform="translate(145, 0)">
        <rect x="0" y="0" width="165" height="34" rx="17" fill="rgba(255, 255, 255, 0.06)" stroke="rgba(255,255,255,0.12)" stroke-width="1" />
        <text x="18" y="22" class="pill-text">🛡️ Watermark-Free</text>
      </g>

      <!-- Pill 3: Self-Hosted -->
      <g transform="translate(320, 0)">
        <rect x="0" y="0" width="155" height="34" rx="17" fill="rgba(255, 255, 255, 0.06)" stroke="rgba(255,255,255,0.12)" stroke-width="1" />
        <text x="18" y="22" class="pill-text">⚡ No Subscription</text>
      </g>

      <!-- Pill 4: Cross-Platform -->
      <g transform="translate(485, 0)">
        <rect x="0" y="0" width="160" height="34" rx="17" fill="rgba(255, 255, 255, 0.06)" stroke="rgba(255,255,255,0.12)" stroke-width="1" />
        <text x="18" y="22" class="pill-text">💻 Multi-Platform</text>
      </g>
    </g>

    <!-- Stat/Highlight Callouts -->
    <g transform="translate(0, 215)">
      <text x="0" y="16" fill="#64748b" font-size="12" font-family="sans-serif" font-weight="600" letter-spacing="0.5">COVERING TOP TOOLS:</text>
      <text x="0" y="38" fill="#e2e8f0" font-size="14" font-family="sans-serif" font-weight="600">
        OpenCut • LosslessCut • Blender VSE • Shotcut • Olive • OpenShot • Kdenlive • Flowblade
      </text>
    </g>
  </g>
</svg>